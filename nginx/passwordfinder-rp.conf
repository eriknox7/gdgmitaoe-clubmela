worker_processes 1;

pid /tmp/passwordfinder-nginx.pid;
error_log /tmp/passwordfinder-nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/passwordfinder-nginx-access.log;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 4096;
    types_hash_bucket_size 128;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy-temp;
    fastcgi_temp_path     /tmp/nginx-fastcgi-temp;
    uwsgi_temp_path       /tmp/nginx-uwsgi-temp;
    scgi_temp_path        /tmp/nginx-scgi-temp;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        # Prevent nginx from adding :8080 to redirects
        absolute_redirect off;

        client_max_body_size 20m;

        # ── Primary entry point ───────────────────────────────────────
        # Use this URL in iframes: http://<server>:8080/password-game/
        location /password-game/ {
            proxy_pass https://neal.fun/password-game/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;

            # Fix upstream redirects so they don't expose port 8080
            proxy_redirect https://neal.fun/ /;
            proxy_redirect http://neal.fun/  /;

            proxy_set_header Host              neal.fun;
            proxy_set_header User-Agent        $http_user_agent;
            proxy_set_header Accept             $http_accept;
            proxy_set_header Accept-Language    $http_accept_language;
            proxy_set_header Sec-Fetch-Dest    $http_sec_fetch_dest;
            proxy_set_header Sec-Fetch-Mode    $http_sec_fetch_mode;
            proxy_set_header Sec-Fetch-Site    $http_sec_fetch_site;
            proxy_set_header Sec-Fetch-User    $http_sec_fetch_user;
            proxy_set_header Sec-CH-UA         $http_sec_ch_ua;
            proxy_set_header Sec-CH-UA-Mobile  $http_sec_ch_ua_mobile;
            proxy_set_header Sec-CH-UA-Platform $http_sec_ch_ua_platform;
            proxy_set_header Cookie             $http_cookie;
            proxy_set_header Referer            https://neal.fun/;
            proxy_set_header Origin             https://neal.fun;

            proxy_cookie_domain .neal.fun $host;
            proxy_cookie_domain  neal.fun $host;
            proxy_cookie_path / /;

            # Strip all framing-restriction headers
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;

            # Allow framing from any origin
            add_header X-Frame-Options "" always;
            add_header Content-Security-Policy "" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Redirect /password-game → /password-game/ (no upstream round-trip)
        location = /password-game {
            return 301 /password-game/;
        }

        # ── Asset locations (JS fetches /_nuxt/... at runtime) ────────
        location /_nuxt/ {
            proxy_pass https://neal.fun/_nuxt/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host neal.fun;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        location /cdn-cgi/ {
            proxy_pass https://neal.fun/cdn-cgi/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host neal.fun;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        location /general/ {
            proxy_pass https://neal.fun/general/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host neal.fun;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        location /favicons/ {
            proxy_pass https://neal.fun/favicons/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host neal.fun;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # Default: return 404 for anything else
        location / {
            return 404;
        }
    }
}
