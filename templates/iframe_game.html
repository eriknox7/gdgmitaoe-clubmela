<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ game.name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }

    /* ── Fullscreen iframe ── */
    #game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* ── Floating Timer HUD ── */
    #hud {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(10, 10, 10, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 40px;
      padding: 8px 18px 8px 12px;
      font-family: 'Nunito', sans-serif;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      transition: background 0.4s;
      cursor: default;
      user-select: none;
    }

    #hud.warning {
      background: rgba(234, 67, 53, 0.88);
      border-color: rgba(255,255,255,0.2);
      animation: pulse-warning 1s ease-in-out infinite;
    }

    @keyframes pulse-warning {
      0%, 100% { box-shadow: 0 4px 24px rgba(234,67,53,0.4); }
      50%       { box-shadow: 0 4px 40px rgba(234,67,53,0.8); }
    }

    /* Ring timer */
    #ring-wrap {
      position: relative;
      width: 36px; height: 36px;
      flex-shrink: 0;
    }

    #ring-svg {
      transform: rotate(-90deg);
      width: 36px; height: 36px;
    }

    #ring-bg {
      fill: none;
      stroke: rgba(255,255,255,0.12);
      stroke-width: 3;
    }

    #ring-fill {
      fill: none;
      stroke: {{ game.color }};
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 88; /* 2π × 14 ≈ 87.96 */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.4s;
    }

    #hud.warning #ring-fill { stroke: #fff; }

    /* Time text */
    #timer-text {
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.5px;
      min-width: 52px;
      text-align: right;
    }

    /* Game name pill (left side of HUD) */
    #game-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.3px;
      border-right: 1px solid rgba(255,255,255,0.12);
      padding-right: 12px;
      margin-right: 2px;
      white-space: nowrap;
    }

    /* ── Time's Up overlay ── */
    #timesup-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      font-family: 'Nunito', sans-serif;
    }

    #timesup-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .timesup-icon {
      font-size: 5rem;
      margin-bottom: 16px;
      animation: bounce-in 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
    }

    .timesup-title {
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 8px;
      animation: bounce-in 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.35s both;
    }

    .timesup-sub {
      font-size: 1rem;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      animation: bounce-in 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.45s both;
    }

    .timesup-bar {
      width: 60px; height: 5px;
      border-radius: 4px;
      margin: 24px 0 8px;
      background: {{ game.color }};
      animation: bounce-in 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.5s both;
    }

    @keyframes bounce-in {
      from { opacity: 0; transform: scale(0.7) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Fullscreen game iframe -->
  <iframe
    id="game-frame"
    src="{{ iframe_src }}"
    allowfullscreen
    allow="fullscreen"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
    referrerpolicy="no-referrer"
    scrolling="yes"
  ></iframe>

  <!-- Floating HUD -->
  <div id="hud">
    <span id="game-label">{{ game.icon }} {{ game.name }}</span>
    <div id="ring-wrap">
      <svg id="ring-svg" viewBox="0 0 36 36">
        <circle id="ring-bg" cx="18" cy="18" r="14"/>
        <circle id="ring-fill" cx="18" cy="18" r="14"/>
      </svg>
    </div>
    <span id="timer-text">--:--</span>
  </div>

  <!-- Time's Up overlay -->
  <div id="timesup-overlay">
    <div class="timesup-icon">⏰</div>
    <div class="timesup-title">Time's Up!</div>
    <div class="timesup-bar"></div>
    <div class="timesup-sub">Head back to the admin to submit your score.</div>
  </div>

  <script>
    const ENDS_AT  = {{ ends_at }};   // epoch ms baked in by dashboard QR
    const TOTAL    = Math.max(1, Math.round((ENDS_AT - Date.now()) / 1000));
    const CIRCUMF  = 88;              // 2π × 14 ≈ 87.96, matches stroke-dasharray

    const ringFill  = document.getElementById('ring-fill');
    const timerText = document.getElementById('timer-text');
    const hud       = document.getElementById('hud');
    const overlay   = document.getElementById('timesup-overlay');

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function getRemaining() {
      return Math.max(0, Math.floor((ENDS_AT - Date.now()) / 1000));
    }

    function tick() {
      const remaining = getRemaining();
      timerText.textContent = fmt(remaining);
      ringFill.style.strokeDashoffset = CIRCUMF * (1 - remaining / TOTAL);
      if (remaining <= 60) hud.classList.add('warning');
      if (remaining <= 0) { clearInterval(interval); overlay.classList.add('show'); }
    }

    // Initialise immediately (handles reload mid-session)
    tick();
    const interval = setInterval(tick, 1000);
  </script>

</body>
</html>
